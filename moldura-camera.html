    if (resgate.cresceu && tl < CT.some && Math.random() < .3)                   // chuvinha de glitter na festa
      faisca(rnd(P.ax, P.lx + 16 * k), b - rnd(50, 140) * k, rnd(3, 6) * k, rnd(.4, .8), escolhe(brilhos));
    if (tl >= CT.some && !resgate.pufou) {
      resgate.pufou = true;
      const [jx2, jy2, esc2] = posJinx(tl);
      puf(jx2, jy2 - 50 * k * esc2, .6); puf(P.lx, b - 42 * k, .45);
    }
    if (tl >= CT.fim) resgate = null;
  }
  function desenhaResgate(t) {
    if (!resgate) return;
    const tl = tempoResgate(t), b = baseResgate(), P = palcoResgate();
    const sJ = carimbosExtras.jinx, sA = carimbosExtras.ashe;
    if (!sJ || !sA || !carimboBon) return;
    const anel = (x2, y2, r, cor, a2) => { ctx.save(); ctx.translate(x2, y2 + 1.5 * k); ctx.scale(1, .3); ctx.globalAlpha = .6 * a2; ctx.strokeStyle = cor; ctx.lineWidth = 2.4 * k; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); ctx.restore(); };
    const stampa = (st, tam, x2, y2, esc2, flip2, a2) => {
      ctx.save(); ctx.globalAlpha = a2; ctx.translate(x2, y2);
      if (flip2) ctx.scale(-1, 1);
      ctx.scale(tam * k * esc2, tam * k * esc2);
      ctx.drawImage(st.c, st.vb[0], st.vb[1], st.vb[2], st.vb[3]);
      ctx.restore();
    };
    const barra = (x2, y2, frac, cor, larg, escudo, a2) => {
      const bw = larg, bh = 5 * k;
      ctx.globalAlpha = a2;
      ctx.fillStyle = 'rgba(8,6,18,.85)'; ctx.fillRect(x2 - bw / 2 - 1.2 * k, y2 - bh - 1.2 * k, bw + 2.4 * k, bh + 2.4 * k);
      ctx.fillStyle = '#2a2a34'; ctx.fillRect(x2 - bw / 2, y2 - bh, bw, bh);
      ctx.fillStyle = cor; ctx.fillRect(x2 - bw / 2, y2 - bh, bw * Math.max(0, Math.min(1, frac)), bh);
      if (escudo) { ctx.fillStyle = 'rgba(255,255,255,' + f(.4 + .25 * Math.sin(t * 10)) + ')'; ctx.fillRect(x2 - bw / 2, y2 - bh, bw * Math.min(1, frac), 1.8 * k); }
      ctx.globalAlpha = 1;
    };
    // a ASHE (time vermelho): entra atirando, se assusta e foge
    const [ax2, ay2, aA] = posAshe(tl);
    if (aA > 0) {
      anel(ax2, ay2, 24 * k, VERM_TIME, aA);
      if (tl >= CT.foge) {                              // rastrinho de quem saiu correndo
        ctx.globalAlpha = aA * .5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6 * k; ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(ax2 + (16 + i * 7) * k, ay2 - (24 + i * 16) * k); ctx.lineTo(ax2 + (34 + i * 7) * k, ay2 - (24 + i * 16) * k); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      stampa(sA, sA.tam, ax2, ay2, 1, tl < CT.foge, aA);
      barra(ax2, ay2 - 88 * k, 1, VERM_TIME, 32 * k, false, aA);
      if (tl >= CT.susto && tl < CT.foge + .3) {        // o "!" do susto
        ctx.globalAlpha = aA; ctx.font = '700 ' + f(17 * k) + 'px ' + FAMILIA; ctx.textAlign = 'center';
        ctx.lineWidth = 3.4 * k; ctx.strokeStyle = CONT; ctx.strokeText('!', ax2, ay2 - 96 * k);
        ctx.fillStyle = VERM_TIME; ctx.fillText('!', ax2, ay2 - 96 * k);
        ctx.globalAlpha = 1;
      }
    }
    // a JINX (time azul): quase low até a Lulu chegar
    const [jx2, jy2, esc2] = posJinx(tl);
    const aJ = tl >= CT.some ? Math.max(0, 1 - (tl - CT.some) / .3) : 1;
    if (aJ > 0) {
      anel(jx2, jy2, 24 * k * esc2, AZUL_TIME, aJ);
      stampa(sJ, sJ.tam, jx2, jy2, esc2, false, aJ);
      const hpJ = resgate.cresceu ? Math.min(1, resgate.hp + (tl - CT.cresce) * 1.6) : resgate.hp;
      barra(jx2, jy2 - 88 * k * esc2, hpJ, AZUL_TIME, 34 * k * Math.min(1.5, esc2), resgate.cresceu, aJ);
    }
    // a LULU: surge num puf de glitter, ulta e vai embora
    if (tl >= CT.lulu) {
      const pop = volta(Math.min(1, (tl - CT.lulu) / .3));
      const aL = tl >= CT.some ? Math.max(0, 1 - (tl - CT.some) / .3) : Math.min(1, (tl - CT.lulu) / .18);
      if (aL > 0) {
        ctx.save();                                     // o circulinho de fada debaixo dela
        ctx.translate(P.lx, b + 1.5 * k); ctx.scale(1, .3); ctx.globalAlpha = .55 * aL;
        ctx.strokeStyle = COR.verdeClaro; ctx.lineWidth = 1.8 * k;
        ctx.beginPath(); ctx.arc(0, 0, 20 * k, 0, 7); ctx.stroke();
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 7; i++) { const an = t * 2 + i * Math.PI * 2 / 7; ctx.beginPath(); ctx.arc(Math.cos(an) * 20 * k, Math.sin(an) * 20 * k, 1.3 * k, 0, 7); ctx.fill(); }
        ctx.restore();
        anel(P.lx, b, 22 * k, AZUL_TIME, aL * .8);
        const sL = SBON * pop;
        ctx.save(); ctx.globalAlpha = aL; ctx.translate(P.lx, b); ctx.scale(sL, sL);
        ctx.drawImage(carimboBon, BON_VB[0], BON_VB[1], BON_VB[2], BON_VB[3]);
        ctx.restore();
        barra(P.lx, b - 92 * k, 1, AZUL_TIME, 30 * k, false, aL);
        if (tl >= CT.ulta && tl < CT.cresce + .3) {     // o raio do Crescimento Selvagem
          const gx2 = P.lx + G[0] * sL, gy2 = b + G[1] * sL, alvoX = jx2, alvoY = jy2 - 44 * k * esc2;
          const g2 = ctx.createLinearGradient(gx2, gy2, alvoX, alvoY);
          g2.addColorStop(0, 'rgba(200,255,168,.9)'); g2.addColorStop(.5, 'rgba(160,106,224,.7)'); g2.addColorStop(1, 'rgba(200,255,168,.9)');
          ctx.globalAlpha = aL * (.7 + .3 * Math.sin(t * 24));
          ctx.strokeStyle = g2; ctx.lineWidth = 3.4 * k; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(gx2, gy2); ctx.lineTo(alvoX, alvoY); ctx.stroke();
          ctx.globalAlpha = 1;
          if (Math.random() < .8) { const v = Math.random(); faisca(gx2 + (alvoX - gx2) * v, gy2 + (alvoY - gy2) * v + rnd(-5, 5) * k, rnd(2.5, 4.5) * k, rnd(.25, .45), escolhe(brilhos)); }
          const rg = (4 + 6 * Math.min(1, (tl - CT.ulta) / .3)) * k, gl2 = ctx.createRadialGradient(gx2, gy2, 0, gx2, gy2, rg);
          gl2.addColorStop(0, 'rgba(255,255,255,.95)'); gl2.addColorStop(.5, 'rgba(200,255,168,.6)'); gl2.addColorStop(1, 'rgba(140,232,90,0)');
          ctx.fillStyle = gl2; ctx.beginPath(); ctx.arc(gx2, gy2, rg, 0, 7); ctx.fill();
        }
      }
    }
    // as flechas de gelo voando
    for (const fl of resgate.flechas) {
      const u = Math.max(0, Math.min(1, (t - fl.t0) / fl.dur));
      const x1 = ax2 + 26 * k, y1 = ay2 - 44 * k, x2 = jx2 - 6 * k, y2 = jy2 - 38 * k;
      const fx = x1 + (x2 - x1) * u, fy = y1 + (y2 - y1) * u;
      const L2 = 16 * k, n2 = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / n2, uy = (y2 - y1) / n2;
      const g3 = ctx.createLinearGradient(fx - ux * L2, fy - uy * L2, fx, fy);
      g3.addColorStop(0, 'rgba(154,212,240,0)'); g3.addColorStop(1, '#eaf6ff');
      ctx.strokeStyle = g3; ctx.lineWidth = 2.2 * k; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx - ux * L2, fy - uy * L2); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(fx + ux * 4.4 * k, fy + uy * 4.4 * k); ctx.lineTo(fx - uy * 2 * k, fy + ux * 2 * k); ctx.lineTo(fx + uy * 2 * k, fy - ux * 2 * k); ctx.closePath(); ctx.fill();
    }
  }

  // ================================================================
  //  partículas (canvas): faíscas, gotas, peixes/borboletas, bolhas soltas e o estouro
  // ================================================================
  const parts = [], MAXP = 420;
  function faisca(x, y, tam, vida, cor) { if (parts.length < MAXP) parts.push({ tipo: 'faisca', x, y, vx: rnd(-10, 10) * k, vy: rnd(-14, 6) * k, tam, vida, idade: 0, rot: rnd(0, 1.5), cor }); }
  function gota(x, y, forca, livre) {                   // livre = pode passar perto da câmera (respingo na borda)
    if (parts.length >= MAXP) return;
    const a = rnd(0, Math.PI * 2), v = rnd(60, 180) * k * forca;
    parts.push({ tipo: 'gota', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * k * forca, w: rnd(1.8, 3.2) * k,
                 fase: rnd(0, 7), vida: rnd(.9, 1.5), idade: 0, livre, cor: escolhe(gotaCores) });
  }
  function peixeSolto(x, y, forca) {
    if (parts.length >= MAXP) return;
    const a = rnd(-Math.PI * .95, -.1), v = rnd(90, 210) * k * forca;    // saem pra cima, em leque
    parts.push({ tipo: 'peixe', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, fase: rnd(0, 7),
                 tam: TAM_PEIXE * k * rnd(.6, .95) * (forca > 1.3 ? 1.5 : 1), cor: Math.floor(rnd(0, CORES_PEIXE.length)), vida: rnd(1.4, 2.2), idade: 0 });
  }
  function bolhaSolta(x, y) {
    if (parts.length >= MAXP) return;
    parts.push({ tipo: 'bolhaS', x, y, vx: rnd(-26, 26) * k, vy: -rnd(50, 120) * k, r: rnd(1.8, 4.2) * k, fase: rnd(0, 7), vida: rnd(.9, 1.6), idade: 0 });
  }
  function puf(x, y, tam) {                             // o splash de chegada e de saída do campeão
    parts.push({ tipo: 'estouro', x, y, tam, rot: rnd(0, 1), idade: 0, vida: .5 });
    for (let i = 0; i < 10; i++) gota(x + rnd(-8, 8) * k, y + rnd(-14, 14) * k, .6);
    for (let i = 0; i < 6; i++) bolhaSolta(x + rnd(-18, 18) * k, y + rnd(-10, 20) * k);
    for (let i = 0; i < 8; i++) faisca(x + rnd(-24, 24) * k, y + rnd(-30, 30) * k, rnd(3.5, 6) * k, rnd(.4, .8), escolhe(brilhos));
  }
  function desenhaBrilho(x, y, s, rt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rt);
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * .18, -s * .18, s, 0); ctx.quadraticCurveTo(s * .18, s * .18, 0, s);
    ctx.quadraticCurveTo(-s * .18, s * .18, -s, 0); ctx.quadraticCurveTo(-s * .18, -s * .18, 0, -s);
    ctx.fill(); ctx.restore();
  }
  function desenhaPeixe(p, t, girar) {                  // o carimbo do peixinho, virado pro lado que está indo
    if (!carimbosPeixe.length) return;
    const esq = p.vx < 0, th = girar ? Math.atan2(p.vy, p.vx) : 0;
    const balanco = Math.sin(t * 6 + p.fase) * .22;
    ctx.translate(p.x, p.y);
    if (esq) ctx.rotate((girar ? th + Math.PI : 0) + balanco);
    else { ctx.scale(-1, 1); ctx.rotate((girar ? -th : 0) - balanco); }
    ctx.scale(p.tam, p.tam);
    ctx.drawImage(carimbosPeixe[p.cor], PEIXE_VB[0], PEIXE_VB[1], PEIXE_VB[2], PEIXE_VB[3]);
  }
  function desenhaParticulas(t, dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.idade += dt;
      if (p.idade >= p.vida) { parts.splice(i, 1); continue; }
      const u = p.idade / p.vida;
      if (p.tipo === 'estouro') {                       // clarão, anéis de choque e raios de luz
        const s = p.tam * k, e = 1 - u, R = (14 + 60 * u) * s, g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        g.addColorStop(0, 'rgba(255,255,255,' + f(.95 * e) + ')');
        g.addColorStop(.35, NAUT ? 'rgba(130,235,212,' + f(.6 * e) + ')' : 'rgba(150,240,228,' + f(.6 * e) + ')');
        g.addColorStop(1, 'rgba(82,220,200,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.fill();
        if (p.grande) {                                 // a batida na borda: anel de choque duplo
          ctx.globalAlpha = e;
          ctx.strokeStyle = '#b8fff0'; ctx.lineWidth = 3.4 * s * e + .6;
          ctx.beginPath(); ctx.arc(p.x, p.y, (12 + 86 * u) * s, 0, 7); ctx.stroke();
          ctx.strokeStyle = '#f3cd7d'; ctx.lineWidth = 2 * s * e + .4;
          ctx.beginPath(); ctx.arc(p.x, p.y, (6 + 60 * u) * s, 0, 7); ctx.stroke();
        } else {
          ctx.globalAlpha = e; ctx.strokeStyle = NAUT ? '#b8fff0' : LULU ? '#e3d1fa' : '#d9fffa'; ctx.lineWidth = 3 * s * e + .5;
          ctx.beginPath(); ctx.arc(p.x, p.y, (12 + 80 * u) * s, 0, 7); ctx.stroke();
        }
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * s * e + .3; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let j = 0; j < 12; j++) {
          const an = j * Math.PI / 6 + u * .5 + p.rot, r1 = (10 + 36 * u) * s, r2 = (22 + 84 * u) * s * (j % 2 ? .7 : 1);
          ctx.moveTo(p.x + Math.cos(an) * r1, p.y + Math.sin(an) * r1); ctx.lineTo(p.x + Math.cos(an) * r2, p.y + Math.sin(an) * r2);
        }
        ctx.stroke();
        continue;
      }
      let a = (u > .7 ? (1 - u) / .3 : 1) * naFonte(p.x, p.y);
      if (p.tipo === 'faisca') {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (a <= 0) continue;
        ctx.globalAlpha = a; ctx.fillStyle = p.cor;
        desenhaBrilho(p.x, p.y, p.tam * Math.sin(Math.min(1, u * 1.4) * Math.PI), p.rot + u * 1.4);
      } else if (p.tipo === 'gota') {
        p.vx *= 1 - Math.min(1, 1.6 * dt); p.vy = p.vy * (1 - Math.min(1, 1.2 * dt)) + 190 * k * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (!p.livre) a *= pertoCam(p.x, p.y, 12 * k);
        if (a <= 0) continue;
        const n = Math.hypot(p.vx, p.vy) || 1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
        ctx.globalAlpha = a; ctx.fillStyle = p.cor;
        ctx.beginPath(); ctx.ellipse(0, 0, p.w * .78, p.w * (1 + Math.min(.8, n / (300 * k))), 0, 0, 7); ctx.fill();
        ctx.globalAlpha = a * .8; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-p.w * .22, -p.w * .3, p.w * .26, 0, 7); ctx.fill();
        ctx.restore();
      } else if (p.tipo === 'peixe') {                  // peixinho espantado: sai voando e cai abanando o rabo
        p.vx *= 1 - Math.min(1, 1.4 * dt); p.vy = p.vy * (1 - Math.min(1, 1.4 * dt)) + 150 * k * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        a *= pertoCam(p.x, p.y, 16 * k) * naFonte(p.x, p.y, 34);
        if (a <= 0 || !carimbosPeixe.length) continue;
        ctx.save(); ctx.globalAlpha = a;
        desenhaPeixe(p, t, true);
        ctx.restore();
      } else if (p.tipo === 'cruza') {                  // peixinho passeando: cruza a área nadando
        p.x += p.vx * dt; p.y = p.y0 + Math.sin(t * 2 + p.fase) * 6 * k;
        a = Math.min(1, u * 6, (1 - u) * 6) * pertoCam(p.x, p.y, 14 * k) * naFonte(p.x, p.y, 24);
        if (a <= 0 || !carimbosPeixe.length) continue;
        if (Math.random() < dt * 1.2) bolhaSolta(p.x + (p.vx < 0 ? 12 : -12) * k * p.tam / (TAM_PEIXE * k), p.y - 2 * k);
        ctx.save(); ctx.globalAlpha = a;
        desenhaPeixe(p, t, false);
        ctx.restore();
      } else if (p.tipo === 'bolhaS') {                 // bolha solta do estouro: sobe rapidinho e some
        p.vy *= 1 - Math.min(1, 1.2 * dt);
        p.x += (p.vx + Math.sin(t * 5 + p.fase) * 10 * k) * dt; p.y += p.vy * dt;
        p.vx *= 1 - Math.min(1, 1.2 * dt);
        if (a <= 0) continue;
        ctx.globalAlpha = a * .9;
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(.6, p.r * .16);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x - p.r * .3, p.y - p.r * .3, p.r * .4, Math.PI * .95, Math.PI * 1.55); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ================================================================
  //  balõezinhos do mascote
  // ================================================================
  let balaoEl = null, tiraBalao = 0, tiraFala = 0, ultimaFala = '';
  function balao(texto, ax, ay, dur) {
    if (balaoEl) balaoEl.remove();
    clearTimeout(tiraBalao);
    const fs = 17 * k;
    medidor.font = fs + 'px ' + FAMILIA;
    const tw = medidor.measureText(texto).width, bw = tw + 24 * k, bh = fs * 1.4 + 8 * k;
    let cx = ax, cy = ay - bh / 2 - 16 * k;
    cx = Math.min(Math.min(RR, LIM_DIR) - bw / 2 - 4 * k, Math.max(RX + bw / 2 + 4 * k, cx));
    cy = Math.min(RB - bh / 2 - 4 * k, Math.max(RY + bh / 2 + 4 * k, cy));
    if (cx + bw / 2 > X && cx - bw / 2 < X + W && cy + bh / 2 > Y && cy - bh / 2 < Y + H) {   // nunca em cima da câmera: vai pro lado de fora, ou pra cima dela
      if (X - 6 * k - bw >= RX + 4 * k) cx = X - 6 * k - bw / 2;
      else cy = Math.max(RY + bh / 2 + 2 * k, Y - bh / 2 - 8 * k);
    }
    const x0 = cx - bw / 2, y0 = cy - bh / 2, y1 = cy + bh / 2;
    const bx = Math.min(x0 + bw - bh / 2 - 2 * k, Math.max(x0 + bh / 2 + 2 * k, ax)), ty = Math.max(ay, y1 + 6 * k);
    const cauda = 'M' + f(bx - 6 * k) + ' ' + f(y1 - 2.5 * k) + 'L' + f(ax + (ax - bx) * .2) + ' ' + f(ty) + 'L' + f(bx + 6 * k) + ' ' + f(y1 - 2.5 * k) + 'Z';
    const caixa = 'x="' + f(x0) + '" y="' + f(y0) + '" width="' + f(bw) + '" height="' + f(bh) + '" rx="' + f(bh / 2) + '"';
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'balao');
    g.innerHTML = '<rect ' + caixa + ' transform="translate(' + f(2 * k) + ' ' + f(3 * k) + ')" fill="rgba(0,0,0,.3)"/>' +
      '<path d="' + cauda + '" fill="#fff" stroke="' + CONT + '" stroke-width="' + f(2.4 * k) + '" stroke-linejoin="round"/>' +
      '<rect ' + caixa + ' fill="#fff" stroke="' + CONT + '" stroke-width="' + f(2.4 * k) + '"/>' +
      '<rect x="' + f(x0 + 2.6 * k) + '" y="' + f(y0 + 2.6 * k) + '" width="' + f(bw - 5.2 * k) + '" height="' + f(bh - 5.2 * k) + '" rx="' + f(bh / 2 - 2.6 * k) + '" fill="none" stroke="' + ARTE.balaoTrim + '" stroke-width="' + f(1.2 * k) + '"/>' +
      '<path d="' + cauda + '" fill="#fff"/>' +
      '<text x="' + f(cx + 1.2 * k) + '" y="' + f(cy + fs * .36 + 1.2 * k) + '" text-anchor="middle" font-family=\'' + FAMILIA.replace(/"/g, '') + '\' font-size="' + f(fs) + '" fill="' + ARTE.balaoTrim + '"></text>' +
      '<text x="' + f(cx) + '" y="' + f(cy + fs * .36) + '" text-anchor="middle" font-family=\'' + FAMILIA.replace(/"/g, '') + '\' font-size="' + f(fs) + '" fill="' + ARTE.balaoTexto + '"></text>';
    for (const tx of g.querySelectorAll('text')) tx.textContent = texto;
    topo.appendChild(g);
    balaoEl = g;
    if (g.animate) g.animate([{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 280, easing: 'ease-out' });
    tiraBalao = setTimeout(() => {
      const sai = () => { if (balaoEl === g) balaoEl = null; g.remove(); };
      if (g.animate) g.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.3)', opacity: 0 }], { duration: 220, easing: 'ease-in' }).onfinish = sai;
      else sai();
    }, (dur || 2.8) * 1000);
  }
  function falar(texto, dur) {                          // o mascote fala (sem mascote, o balão sai da placa)
    if (masc) {
      mascEl.classList.add('fala');
      clearTimeout(tiraFala);
      tiraFala = setTimeout(() => mascEl.classList.remove('fala'), 900);
      balao(texto, masc.x + (masc.espelho ? 3 : -3) * k, masc.topo + 4 * k, dur);
    } else if (placa) balao(texto, placa.cx, placa.y0 + 2 * k, dur);
  }
  function fala() {
    if (!FALAS.length || (!masc && !placa)) return;
    let txt = escolhe(FALAS);
    for (let i = 0; i < 5 && FALAS.length > 1 && txt === ultimaFala; i++) txt = escolhe(FALAS);
    ultimaFala = txt;
    falar(txt);
  }

  // ================================================================
  //  a placa pula e os enfeites pulam em onda
  // ================================================================
  function brilhoPlaca() {
    if (placaEl && placaEl.animate) {
      placaEl.animate([
        { transform: 'scale(1) rotate(0deg)' }, { transform: 'scale(1.18) rotate(-3deg)', offset: .25 },
        { transform: 'scale(.96) rotate(2deg)', offset: .5 }, { transform: 'scale(1.04) rotate(-1deg)', offset: .75 },
        { transform: 'scale(1) rotate(0deg)' },
      ], { duration: 850, easing: 'ease-out' });
    }
    if (!placa) return;
    for (let i = 0; i < 12; i++) gota(rnd(placa.x0, placa.x1), placa.cy + rnd(-.6, .6) * placa.TH, .7, true);
    for (let i = 0; i < 8; i++) faisca(rnd(placa.x0, placa.x1), placa.cy + rnd(-.9, .9) * placa.TH, rnd(4, 7.5) * k, rnd(.5, 1), escolhe(brilhos));
  }
  function onda() {                                     // tudo pula, em onda a partir do nome
    const cx = placa ? placa.cx : X + W / 2;
    for (const el of cena.querySelectorAll('.pop')) {
      const d = Math.abs(el.dataset.x - cx) / Math.max(W, 200 * k);
      if (el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: .35 }, { transform: 'scale(.96)', offset: .7 }, { transform: 'scale(1)' }],
        { duration: 560, delay: 60 + d * 600, easing: 'ease-out' });
    }
  }

  // ================================================================
  //  encaixe na janela / fonte do OBS
  // ================================================================
  let K = 1;
  function ajustar() {
    let s = Math.min(innerWidth / SW, innerHeight / SH);
    let ox = (innerWidth - SW * s) / 2, oy = (innerHeight - SH * s) / 2;
    if (zoom) {                                        // prévia: só a moldura, bem de perto
      s = Math.min(innerWidth / RW, innerHeight / RH);
      ox = (innerWidth - RW * s) / 2 - RX * s; oy = (innerHeight - RH * s) / 2 - RY * s;
    }
    palco.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
    K = s * (window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(RW * K)); canvas.height = Math.max(1, Math.round(RH * K));
    prepararCarimbos();
  }

  // ================================================================
  //  loop
  // ================================================================
  let last = 0, proxEvento = 0, proxFaisca = 0, proxFala = 0, proxPeixe = 0;
  function frame(ms) {
    try {
    const t = ms / 1000, dt = Math.min(.05, Math.max(0, t - last));
    last = t;
    if (EVENTO > 0 && t >= proxEvento && !bon && !ancora && !ondaAgua && !resgate) proxEvento = t + (evento(t) ? EVENTO : .5);
    if (FALAS.length && t >= proxFala) {               // balãozinho do mascote (fora do evento, que já tem a fala dele)
      const livre = t > evAte + .5;
      if (livre) fala();
      proxFala = t + (livre ? C.falasCada * rnd(.75, 1.25) : 2);
    }
    if (t >= proxFaisca && flores.length) {            // brilhinho de vez em quando na placa, no emblema, no mascote ou nas conchas
      const fl = escolhe(flores);
      faisca(fl.x + rnd(-.8, .8) * fl.r, fl.y + rnd(-.8, .8) * fl.r, rnd(4, 6.5) * k, rnd(.5, .8), escolhe(brilhos));
      if (masc && Math.random() < .3) bolhaSolta(masc.x - (NAUT ? 0 : 15 * masc.s), masc.y - (NAUT ? 12 : 18) * masc.s);   // o mascote solta bolhinhas
      proxFaisca = t + rnd(1, 2.4);
    }
    if (PEIXES && t >= proxPeixe) {                    // um peixinho cruza a área nadando
      if (carimbosPeixe.length && parts.length < MAXP) {
        const z = zonaAleatoria(), dir = Math.random() < .5 ? 1 : -1;
        const vx = dir * rnd(34, 58) * k * Math.max(.5, VEL), larg = z.x1 - z.x0 - 12 * k;
        if (larg > 60 * k) {
          const y = rnd(z.y0 + 24 * k, Math.max(z.y0 + 24 * k, z.y1 - 40 * k));
          parts.push({ tipo: 'cruza', x: dir > 0 ? z.x0 + 6 * k : z.x1 - 6 * k, y, y0: y, vx, fase: rnd(0, 7),
                       tam: TAM_PEIXE * k * rnd(.65, .95), cor: Math.floor(rnd(0, CORES_PEIXE.length)), vida: larg / Math.abs(vx), idade: 0 });
        }
      }
      proxPeixe = t + rnd(9, 22);
    }
    tb += dt * VEL;
    for (const p of bolhas) moverBolha(p, dt);
    if (bon) atualizaBoneco(t);
    if (ancora) atualizaAncora(t);
    if (resgate) atualizaResgate(t);

    ctx.setTransform(K, 0, 0, K, -RX * K, -RY * K);
    ctx.clearRect(RX, RY, RW, RH);
    desenhaBolhas(t);
    desenhaParticulas(t, dt);
    desenhaBoneco(t);
    desenhaAncoraVoo(t);
    desenhaOnda(t, dt);
    desenhaResgate(t);
    } catch (e) { console.error('moldura:', e); }   // um tropeço num frame não derruba a animação
    agenda();
  }
  function agenda() {                                  // com a página escondida o rAF para; segue no soquinho
    if (document.hidden) setTimeout(() => frame(performance.now()), 50);
    else requestAnimationFrame(frame);
  }

  function comecar() {
    if (comecou) return;
    comecou = true;
    montar();
    ajustar();
    addEventListener('resize', ajustar);
    const t = performance.now() / 1000;
    last = t; proxEvento = t + (CONGELA ? .6 : 3); proxFaisca = t + 1; proxFala = t + 7; proxPeixe = t + rnd(4, 9);
    addEventListener('pointerdown', () => {            // clique (ou "Interagir" no OBS) = âncora / onda agora
      const now = performance.now() / 1000;
      if (now - evT0 > 1.2 && !bon && !ancora && !ondaAgua && !resgate) { if (evento(now) && EVENTO > 0) proxEvento = now + EVENTO; }
    });
    agenda();
  }
  Promise.race([Promise.all([document.fonts.load('22px "' + C.fonte + '"', (NOME || 'N') + 'ÂÃÇÉÊÍÓÕÚ'), document.fonts.load('17px "' + C.fonte + '"', FALAS.join('') + T.falaEvento)]),
                new Promise(r => setTimeout(r, 3000))]).then(comecar, comecar);
})();
</script>
