<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nooxblad3 · Moldura da Câmera</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<!--
  ================================================================
   NOOXBLAD3 · MOLDURA DA CÂMERA  -  fonte "Navegador" do OBS
  ================================================================
   Moldura do fundo do mar, com DOIS CAMPEÕES do LoL pra escolher:

   ?campeao=nautilus (o padrão)
     Borda de aço naval com filete de bronze, cantoneiras
     rebitadas nos cantos de cima e elos de corrente por dentro.
     O nome fica numa PLACA DE NAVIO deitada na borda de cima.
     Na lateral esquerda, por fora, uma escotilha de bronze com o
     vidro verde-água brilhando, na frente de um timão que gira
     devagar; a corrente da âncora desce pela borda da esquerda.
     Na borda de cima, perto do canto direito, uma argola de
     amarração de bronze. Um caranguejinho fica sentado na borda,
     mexe as garras e solta balõezinhos. Bolhas sobem devagar e,
     de vez em quando, um peixinho cruza a tela.
     De tempos em tempos tem ÂNCORA: o Nautilus surge num
     redemoinho, gira a âncora e ARREMESSA na argola do canto
     direito — a corrente estica e ele se arrasta até lá, igual
     ao Q, batendo na borda com faíscas, anéis de choque e
     peixes espantados.

   ?campeao=nami
     Borda de água viva com filete dourado, leques de concha nos
     cantos de cima e cordão de pontinhos de pérola por dentro.
     O nome fica num ESTANDARTE DE ONDA deitado na borda de cima.
     Na lateral esquerda, por fora, a pérola do Invocamarés num
     engaste de concha, na frente do aro das marés girando; o
     cordão de pérolas desce pela borda da esquerda com uma
     estrela-do-mar na ponta. Perto do canto direito, uma
     presilha de concha com pérola. Um koizinho nada parado em
     cima da borda, solta bolhinhas e balõezinhos; às vezes um
     koi cruza a tela.
     De tempos em tempos tem VAGALHÃO: a Nami surge num
     redemoinho, ergue o cetro e uma ONDA varre e INUNDA a câmera
     com água translúcida — dá pra ver o streamer por baixo —
     com kois nadando dentro, espuma e bolhas, até a água escoar.

   ?campeao=lulu
     Borda de fada: roxa com glitter, filete dourado, folhinhas
     nos cantos e pontinhos verdes por dentro. O nome fica numa
     placa deitada na borda de cima. Na lateral esquerda, um
     cogumelo encantado na frente de um círculo de fada girando;
     um cipó com florzinhas desce pela borda, com uma borboleta
     pousada na ponta. O PIX (a fadinha) voa em cima da borda
     soltando brilhinhos e balõezinhos. Glitter sobe no lugar
     das bolhas e borboletas cruzam a tela.
     De tempos em tempos tem RESGATE: a Jinx aparece quase
     morrendo (time azul), correndo de uma Ashe inimiga (time
     vermelho) que atira flechas de gelo — até a Lulu surgir num
     puf de glitter e ULTAR a Jinx: Crescimento Selvagem! Ela
     fica GIGANTE, a vida enche com escudo, a Ashe sai correndo
     e o dia está salvo.

   DOIS MODELOS
     ?tela=lol   a tela do LoL: câmera embaixo, entre o painel de
                 itens e o minimapa, encostada na beirada de baixo
                 (o padrão). A fonte cobre a tela toda.
     ?solta      só a câmera, com borda em volta toda: a fonte é a
                 câmera + uma margem pros enfeites. Agrupe com a
                 webcam no OBS e mova as duas juntas.

   COMO COLOCAR NO OBS (tela do LoL)
     1. Fontes -> + -> Navegador
     2. URL: o link desta página, ex.: ?tela=lol&campeao=nami
     3. Largura e altura = tamanho da tela do OBS (1920 x 1080).
        A moldura cai sozinha em volta da câmera.
     4. Deixe a moldura ACIMA da câmera na lista de fontes.

   OPÇÕES NO LINK (junte com &)
     ?campeao=nautilus         o tema (nautilus, nami ou lulu; o padrão é nautilus)
     ?tela=lol                 a tela do LoL (o padrão)
     ?solta                    modelo só da câmera (usa só largura/altura)
     ?x=1270&y=863             canto de cima-esquerdo da câmera, em pixels da tela
     ?largura=365&altura=217   tamanho da câmera
     ?resolucao=1280x720       tamanho da tela do OBS, se não for 1920x1080
     ?nome=Noox                texto da placa (?nome= esconde)
     ?bolhas=16                quantas bolhas subindo (0 a 300; 0 = sem bolhas)
     ?velocidade=0.6           velocidade das bolhas (1 = o padrão, 2 = rápido)
     ?evento=45                segundos entre uma âncora/onda e outra (0 = desliga)
     ?nautilus=0 / ?nami=0 / ?lulu=0   evento sem o campeão (âncora sai da escotilha / onda sozinha / só glitter)
     ?mascote=0                sem o caranguejo / koizinho
     ?emblema=0                sem a escotilha / pérola (e o aro girando)
     ?corrente=0               sem a corrente da âncora / cordão de pérolas
     ?conchas=0                sem as cracas / conchas (e os adesivos do solto)
     ?peixes=0                 sem os peixinhos cruzando
     ?falas=0                  sem os balõezinhos
     ?falas=Oi,Tudo bem?       troca as falas (separe com vírgula)
     ?zoom                     só na prévia da tela do LoL: mostra a moldura de pertinho

   Abrindo no navegador aparece um fundo de exemplo, com o HUD do
   LoL e o overlay dele de mentirinha no lugar (clique em qualquer
   lugar pra soltar a âncora/onda). Dentro do OBS o fundo fica
   transparente.
  ================================================================
-->
<script>
const CONFIG = {
  nome: "Nooxblad3",             // texto da placa que desce do canto, uma letra embaixo da outra ("" = esconde)  ·  link: ?nome=Noox
  fonte: "Lilita One",           // letra do nome e dos balões (Google Fonts, no <link> lá em cima)
  campeao: "nautilus",           // tema padrão  ·  link: ?campeao=nami ou ?campeao=lulu

  tela: { largura: 1920, altura: 1080 },   // tela do OBS em que as medidas abaixo valem
  telas: {                                 // medida da live: câmera embaixo, entre o painel de itens e o minimapa  ·  link: ?tela=lol
    lol: { cam: { x: 1270, y: 863, largura: 365, altura: 217 } },
  },
  telaPadrao: "lol",
  solta: { largura: 365, altura: 217 },    // câmera padrão do modelo solto  ·  link: ?solta&largura=&altura=

  bolhas: 10,                    // quantas bolhas subindo  ·  link: ?bolhas=16
  velocidade: 1,                 // velocidade delas: 2 = rápido, 0.5 = bem devagar  ·  link: ?velocidade=0.6
  evento: 30,                    // segundos entre um evento e outro (âncora / onda / resgate), 0 = desliga  ·  link: ?evento=45
  boneco: true,                  // o campeão aparece no evento  ·  link: ?nautilus=0 / ?nami=0 / ?lulu=0
  mascote: true,                 // o caranguejo / koizinho  ·  link: ?mascote=0
  emblema: true,                 // a escotilha / pérola do canto, com o aro girando  ·  link: ?emblema=0
  corrente: true,                // a corrente da âncora / cordão de pérolas na borda  ·  link: ?corrente=0
  conchas: true,                 // as cracas / conchas (e os adesivos do solto)  ·  link: ?conchas=0
  peixes: true,                  // peixinhos cruzando de vez em quando  ·  link: ?peixes=0
  falasCada: 16,                 // segundos entre um balãozinho e outro  ·  link: ?falas=0 desliga

  borda: 13,                     // grossura da borda (numa câmera de 400 de largura; cresce junto com ela)
  raio: 10,                      // cantos arredondados

  nautilus: {                    // Titã das Profundezas: aço naval, bronze e o brilho verde-água
    falas: ["Soltem as âncoras!", "Ninguém escapa das profundezas", "O mar guarda os seus segredos", "Peso morto no convés!",
            "As profundezas chamam...", "Afundem com o navio!", "Glub glub...", "Cuidado onde você pisa..."],
    falaEvento: "Âncora neles!",  // o que o caranguejo fala quando a âncora estoura
    cores: {
      metal: "#53687a", metalClaro: "#8aa3b5", metalEscuro: "#33434f",
      bronze: "#cf9440", bronzeClaro: "#f3cd7d", bronzeEscuro: "#8a5a1e",
      verde: "#52e8cc", verdeClaro: "#b8fff0", verdeEscuro: "#1d9c82",
      laranja: "#ffb347", laranjaEscuro: "#e07820",
      alga: "#45a35f", algaEscura: "#276b3c",
      casco: "#e8604a", cascoEscuro: "#b03524",       // o caranguejo
      contorno: "#0c1b26",       // azul-marinho quase preto dos contornos
    },
  },
  nami: {                        // Conjuradora das Marés: água viva, pérolas e dourado
    falas: ["A maré está subindo!", "Eu decido o rumo da maré", "Sinta o puxão da maré", "A calmaria vem antes da onda",
            "A água sempre acha o caminho", "As marés obedecem a mim", "Glub!", "Vem nadar comigo!"],
    falaEvento: "Vagalhão!",      // o que o koizinho fala quando a onda estoura
    cores: {
      agua: "#3fd4c5", aguaClara: "#a4f4e9", aguaEscura: "#17889c", aguaProfunda: "#0d5e76",
      perola: "#f7f0f9", perolaRosa: "#f0c9e2",
      coral: "#ff8a5c", coralEscuro: "#d65430",
      dourado: "#f2c75c", douradoClaro: "#ffe9ad", douradoEscuro: "#bb8524",
      koi: "#ff7a3c", koiEscuro: "#e05a1e",
      contorno: "#0a2e3f",       // azul-petróleo quase preto dos contornos
    },
  },
  lulu: {                        // Fada Encantadora: roxo, glitter, cogumelos e o resgate da Jinx
    falas: ["Taca glitter!", "Vai ficar gigante!", "O roxo é o novo azul", "Pix, faz a mágica!",
            "Borboletas!", "Fica docinho!", "Hora do chá!", "Tudo fica melhor gigante"],
    falaEvento: "Crescer!",       // o que o Pix grita quando a Lulu ulta a Jinx
    cores: {
      roxo: "#a06ae0", roxoClaro: "#c9a2f0", roxoEscuro: "#6e3fb0", lilas: "#e7d4fa",
      verde: "#8ce85a", verdeClaro: "#c8ffa8", verdeEscuro: "#4da82e",
      rosa: "#ff9ad4", rosaEscuro: "#e0559e",
      dourado: "#f2c75c", douradoClaro: "#ffe9ad", douradoEscuro: "#bb8524",
      cogumelo: "#e05a68", cogumeloClaro: "#ff8a93",
      pix: "#7ac8ff",
      contorno: "#241038",       // roxo quase preto dos contornos
    },
  },

  fundoDemo: "auto",             // "auto" = fundo de exemplo só fora do OBS · true / false força
};
</script>

<style>

  body.demo { background:#06121b; cursor:pointer; }

  .palco { position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; }

    background:
      radial-gradient(2px 2px at 18% 24%, #c8ffa8aa 50%, transparent 51%), radial-gradient(1.5px 1.5px at 76% 14%, #ffe9ad99 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 42% 44%, #c9a2f099 50%, transparent 51%), radial-gradient(2px 2px at 88% 52%, #c8ffa877 50%, transparent 51%),

  }

  body.demo.solta.nami .palco { background:linear-gradient(170deg, #0e3d4b, #06202c); }

  }

         align-items:center; justify-content:center; text-align:center;
         color:rgba(255,255,255,.72); font:600 calc(18px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; padding:4px; }
  .hud.meta { background:linear-gradient(90deg, #ff3fd1 15%, #9dff57 15%); border:0; border-radius:3px; color:#15351a; font:800 calc(20px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; }
  .hud.texto { background:none; border:0; color:#fff; font:800 calc(24px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; text-shadow:0 2px 3px #000; }
  .hud.mapa { background:radial-gradient(circle at 50% 45%, #1d3b35, #11232b 75%); border:2px solid #b99a5b; border-radius:3px; }

      repeating-linear-gradient(0deg, #111 0 9px, transparent 9px 18px),

    border:6px solid #fff; border-radius:4px; color:transparent; }

          color:rgba(255,255,255,.72) !important; font:600 calc(28px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; }
  .dica b { color:#6fe8d2; font:400 calc(42px * var(--s, 1)) 'Lilita One', 'Segoe UI', sans-serif; }

  /* ---------- enfeites (SVG) ---------- */
  .pop, .placa, .balao, .aro { transform-box:fill-box; transform-origin:50% 50%; }
  .balao { transform-origin:50% 100%; }
  .pisca   { transform-box:fill-box; transform-origin:50% 50%; opacity:0; animation:pisca var(--t) ease-in-out var(--d) infinite; }

  /* emblema do canto (escotilha / pérola) e o aro girando atrás */
  .gira { transform-box:fill-box; transform-origin:50% 50%; animation:gira 44s linear infinite; }
  .gira-contra { transform-box:fill-box; transform-origin:50% 50%; animation:gira 30s linear infinite reverse; }
  .aura { transform-box:fill-box; transform-origin:50% 50%; animation:aura 2.6s ease-in-out infinite alternate; }
  .evento .aura { animation-duration:.3s; }

  /* corrente / cordão: as pontas balançam de leve */
  .cauda-d { transform-box:fill-box; transform-origin:0% 50%; animation:balanca 3.6s ease-in-out infinite alternate; }
  .cauda-b { transform-box:fill-box; transform-origin:50% 0%; animation:balanca2 4.2s ease-in-out .7s infinite alternate; }

  /* mascote: caranguejo (garras) / koi (cauda e nadadeiras) */
  .ms-olhos  { transform-box:fill-box; transform-origin:50% 100%; animation:olho 5.4s linear infinite; }
  .ms-garra-e { transform-box:fill-box; transform-origin:78% 82%; animation:garra 3.1s ease-in-out infinite alternate; }
  .ms-garra-d { transform-box:fill-box; transform-origin:22% 82%; animation:garra2 3.5s ease-in-out .6s infinite alternate; }
  .ms-nucleo { transform-box:fill-box; transform-origin:50% 85%; animation:inclina 8s ease-in-out infinite; }
  .ms-nada   { transform-box:fill-box; transform-origin:50% 50%; animation:nada 3.4s ease-in-out infinite alternate; }
  .ms-cauda  { transform-box:fill-box; transform-origin:8% 50%; animation:cauda 1.1s ease-in-out infinite alternate; }
  .ms-barb   { transform-box:fill-box; transform-origin:20% 10%; animation:barb 1.6s ease-in-out infinite alternate; }
  .fala .ms-nucleo { animation:fala .22s ease-out 4; }
  .fala .ms-nada { animation:fala .22s ease-out 4; }

  /* o Pix: asinhas batendo rápido */
  .px-asa-e { transform-box:fill-box; transform-origin:100% 60%; animation:asa .18s ease-in-out infinite alternate; }
  .px-asa-d { transform-box:fill-box; transform-origin:0% 60%; animation:asa2 .18s ease-in-out infinite alternate; }

  /* algas, corais e conchinhas balançando */
  .balanco { transform-box:fill-box; transform-origin:50% 100%; animation:balanco var(--t) ease-in-out var(--d) infinite alternate; }

  @keyframes corre    { from { stroke-dashoffset:var(--de) } to { stroke-dashoffset:var(--ate) } }
  @keyframes reflexo-v { 0% { transform:translateY(0) skewY(-20deg) } 40%, 100% { transform:translateY(var(--dist)) skewY(-20deg) } }
  @keyframes reflexo-h { 0% { transform:translateX(0) skewX(-20deg) } 40%, 100% { transform:translateX(var(--dist)) skewX(-20deg) } }
  @keyframes pisca    { 0%, 100% { opacity:0; transform:scale(.2) rotate(0deg) } 50% { opacity:1; transform:scale(1) rotate(45deg) } }
  @keyframes cintila  { 0%, 100% { transform:scale(.86) rotate(0deg) } 50% { transform:scale(1.12) rotate(14deg) } }
  @keyframes gira     { to { transform:rotate(360deg) } }
  @keyframes aura     { from { opacity:.45; transform:scale(.88) } to { opacity:1; transform:scale(1.1) } }
  @keyframes balanca  { from { transform:rotate(-2.5deg) } to { transform:rotate(3deg) } }
  @keyframes balanca2 { from { transform:rotate(3deg) } to { transform:rotate(-2.5deg) } }
  @keyframes olho     { 0%, 93%, 100% { transform:scaleY(1) } 96% { transform:scaleY(.12) } }
  @keyframes garra    { 0%, 55%, 100% { transform:rotate(0) } 70%, 85% { transform:rotate(-16deg) } }
  @keyframes garra2   { 0%, 60%, 100% { transform:rotate(0) } 74%, 88% { transform:rotate(14deg) } }
  @keyframes inclina  { 0%, 60%, 100% { transform:rotate(0) } 66%, 82% { transform:rotate(-8deg) } }
  @keyframes nada     { from { transform:translateY(-2.5px) rotate(-3deg) } to { transform:translateY(2.5px) rotate(4deg) } }
  @keyframes cauda    { from { transform:rotate(-16deg) } to { transform:rotate(16deg) } }
  @keyframes barb     { from { transform:rotate(-12deg) } to { transform:rotate(10deg) } }
  @keyframes fala     { 0%, 100% { transform:rotate(0) translateY(0) } 45% { transform:rotate(-5deg) translateY(-1.5px) } }
  @keyframes asa      { from { transform:rotate(-24deg) scaleX(1) } to { transform:rotate(14deg) scaleX(.72) } }
  @keyframes asa2     { from { transform:rotate(24deg) scaleX(1) } to { transform:rotate(-14deg) scaleX(.72) } }
  @keyframes balanco  { from { transform:rotate(calc(var(--a) * -1)) } to { transform:rotate(var(--a)) } }
</style>

<div class="palco">

<script>
(function () {
  'use strict';
  const C = CONFIG;
  const q = new URLSearchParams(location.search);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const escolhe = arr => arr[Math.floor(Math.random() * arr.length)];
  const f = n => Math.round(n * 100) / 100;
  const num = (key, def, min, max) => {
    const v = parseFloat(q.get(key));
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
  };
  const NAO = /^(0|nao|não|false|off)$/i;
  const liga = (key, def) => q.has(key) ? !NAO.test(q.get(key)) : def;   // ?mascote=0 desliga

  // ---------- o campeão: nautilus ou nami ----------
  const camp = (q.get('campeao') || '').toLowerCase();
  const pediu = key => q.has(key) && !NAO.test(q.get(key) || '');        // ?nami sozinho também escolhe o tema
  const TEMA = /lulu/.test(camp) || pediu('lulu') ? 'lulu'
             : /nami/.test(camp) || pediu('nami') ? 'nami'
             : /naut/.test(camp) || pediu('naut') || pediu('nautilus') ? 'nautilus' : C.campeao;
  const NAUT = TEMA === 'nautilus', LULU = TEMA === 'lulu';
  const T = C[TEMA], COR = T.cores, CONT = COR.contorno;
  document.body.classList.add(TEMA);

  // ---------- modelo, tela e câmera (em pixels da tela do OBS) ----------
  // ?tela=lol: a fonte cobre a tela toda e a moldura cai no lugar da câmera
  // ?solta: só a câmera, com borda em volta toda; a fonte é a câmera + margem pros enfeites
  const SOLTA = q.has('solta') || q.get('tela') === 'solta';
  const TELA = C.telas[q.get('tela')] ? q.get('tela') : C.telaPadrao;
  let SW = C.tela.largura, SH = C.tela.altura, X, Y, W, H;
  if (SOLTA) {
    W = num('largura', C.solta.largura, 60, 3840); H = num('altura', C.solta.altura, 34, 2160);

  let FALAS = T.falas.slice();
  if (q.has('falas')) {                                 // ?falas=0 desliga · ?falas=Oi,Tudo bem? troca a lista

  const anima = (t0, t1, a) => 'style="--t:' + f(rnd(t0, t1)) + 's;--d:-' + f(rnd(0, 6)) + 's;--a:' + a + 'deg"';

      '<linearGradient id="gTexto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="' + COR.verdeClaro + '"/></linearGradient>' +
      '<linearGradient id="gReflexo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
      '<pattern id="pMiolo" patternUnits="userSpaceOnUse" width="' + f(hs) + '" height="' + f(hs) + '">' +
        '<circle cx="' + f(hs * .3) + '" cy="' + f(hs * .3) + '" r="' + f(1.5 * k) + '" fill="' + COR.bronze + '" opacity=".85"/>' +
        '<circle cx="' + f(hs * .3 - .45 * k) + '" cy="' + f(hs * .3 - .45 * k) + '" r="' + f(.5 * k) + '" fill="' + COR.bronzeClaro + '"/>' +
        '<path d="M' + f(hs * .68) + ' ' + f(hs * .78) + 'l' + f(2.4 * k) + ' 0" stroke="' + COR.verde + '" stroke-opacity=".5" stroke-width="' + f(.8 * k) + '" stroke-linecap="round"/>' +
      '</pattern>';
    return {
      defs, emblemaSVG, aroSVG, caudaSVG, conchasSVG, adesivo, mascoteSVG, placaExtra, bonecoSVG, peixeSVG, ancoraSVG, argolaSVG, cantoneiraSVG,
      adesivoTipos: ['ancora', 'estrela'],
      renda: { cores: [CONT, COR.verde, COR.verdeClaro] },               // os "elos" tracejados por dentro da borda
      halo: [COR.verde, COR.bronzeClaro],                               // o brilho difuso por fora da borda
      filete: COR.bronze,                                               // o filete entre a borda e o miolo
      sombraPlaca: COR.verdeEscuro,                                     // a sombra das letras do nome
      balaoTrim: COR.verdeClaro, balaoTexto: '#134051',                 // o balãozinho de fala
      emblemaS: .95, aroS: .82, mascS: .92, conchaS: 1,                 // escalas (vezes k)
      BON_VB: [-48, -104, 96, 110], TAM_BON: 1.22, G: [26, -78],        // o carimbo do Nautilus e a mão da âncora
      PEIXE_VB: [-16, -10, 32, 20], TAM_PEIXE: .72,
      CORES_PEIXE: [['#d8f4ef', '#7fe3d2', '#2aa893'], ['#cfe6f2', '#8fb9d0', '#4a7d9c'], ['#eafff9', '#9ff0dd', '#3cc1a6'], ['#f4ead8', '#d9b97f', '#a8854a']],
    };
  }

  // ================================================================
  //  tema NAMI: água viva, pérolas, conchas e dourado
  // ================================================================
  function arteNami() {
    // a pérola do Invocamarés num engaste de concha vieira; centro em (x, y)
    const emblemaSVG = (x, y, s) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')"><g class="pop" data-x="' + f(x) + '">' +
        '<circle class="aura" r="25" fill="url(#gAura)"/>' +
        // a vieira dourada embaixo, de engaste
        '<g transform="translate(0 10)">' +
          '<path d="M-13.6 2.6C-13.6 -4.6 -7.6 -9.6 0 -9.6C7.6 -9.6 13.6 -4.6 13.6 2.6C9 6.8 -9 6.8 -13.6 2.6Z" fill="url(#gOuro)" ' + ct(1.4) + '/>' +
          '<path d="M-10.4 -5.4L-7 3.6M-5.2 -8L-3.4 4.6M0 -8.8L0 5M5.2 -8L3.4 4.6M10.4 -5.4L7 3.6" fill="none" stroke="' + COR.douradoEscuro + '" stroke-width="1" stroke-linecap="round"/>' +
          '<path d="M-4 3.2Q0 5.6 4 3.2L2.6 7.4Q0 8.8 -2.6 7.4Z" fill="url(#gOuro)" ' + ct(1) + '/>' +
        '</g>' +
        // a pérola, com o furta-cor
        '<circle r="12.6" fill="url(#gEmb)" ' + ct(1.4) + '/>' +
        '<path d="M-8.8 -4.4A9.8 9.8 0 0 1 -1.4 -9.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round"/>' +
        '<circle cx="4.6" cy="5.2" r="1.4" fill="#fff" opacity=".6"/>' +
        '<ellipse cx="2.6" cy="-2" rx="7" ry="5.4" fill="' + COR.perolaRosa + '" opacity=".28"/>' +
        '<ellipse cx="-3" cy="3.4" rx="6" ry="4.6" fill="#bfe0f2" opacity=".3"/>' +
      '</g></g>';
    // o aro das marés atrás da pérola: ondinhas girando e um anel de bolhas ao contrário
    const aroSVG = (x, y, s) => {
      let ondas = '', bolinhas = '';
      for (let i = 0; i < 12; i++) {                    // glifos de onda no aro de fora
        const a = i * Math.PI / 6;
        ondas += '<g transform="rotate(' + f(a * 180 / Math.PI) + ') translate(0 -45.6)">' +
          '<path d="M-6 0Q-3 -4.6 0 0Q3 -4.6 6 0" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round"/></g>';
      }
      for (let i = 0; i < 18; i++) {
        const a = i * Math.PI / 9, r = i % 3 ? 1.3 : 2.1;
        bolinhas += '<circle cx="' + f(Math.cos(a) * 33) + '" cy="' + f(Math.sin(a) * 33) + '" r="' + r + '" fill="' + (i % 3 ? '#fff' : COR.aguaClara) + '" opacity="' + (i % 3 ? '.6' : '.85') + '"/>';
      }
      return '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')"><g class="aro">' +
        '<circle r="56" fill="url(#gHalo)"/>' +
        '<g class="gira">' +
          '<circle r="49.4" fill="none" stroke="' + COR.aguaClara + '" stroke-width="1.6"/>' +
          '<circle r="41.6" fill="none" stroke="' + COR.agua + '" stroke-width="1.1"/>' +
          ondas +
        '</g>' +
        '<g class="gira-contra">' +
          bolinhas +
          '<circle r="26" fill="none" stroke="#fff" stroke-width=".9" stroke-dasharray="4.4 2.6"/>' +
          '<circle r="19.5" fill="none" stroke="' + COR.agua + '" stroke-width=".8"/>' +
        '</g>' +
      '</g></g>';
    };
    // o cordão de pérolas deitado na borda: 'd' vai pela borda de cima, 'b' desce pela esquerda com a estrela-do-mar na ponta
    const caudaSVG = (tipo, x, y, L, w) => {
      const s = w / 9, passo = 6.4 * s;
      let d = '';
      const n = Math.max(3, Math.floor(L / passo));
      for (let i = 0; i < n; i++) {
        const u = (i + .5) * passo, r = (i % 3 === 1 ? 3.1 : 2.2) * s;
        const px = tipo === 'd' ? x + u : x - .4 * s, py = tipo === 'd' ? y - .4 * s : y + u;
        d += '<circle cx="' + f(px) + '" cy="' + f(py) + '" r="' + f(r) + '" fill="url(#gPer)" ' + ct(1 * s) + '/>' +
          '<circle cx="' + f(px - r * .3) + '" cy="' + f(py - r * .35) + '" r="' + f(r * .3) + '" fill="#fff" opacity=".85"/>';
      }
      const fx = tipo === 'd' ? x + n * passo + 4 * s : x - .4 * s, fy = tipo === 'd' ? y - .4 * s : y + n * passo + 4 * s;
      d += '<g transform="translate(' + f(fx) + ' ' + f(fy) + ') rotate(16) scale(' + f(s * .9) + ')">' +
        '<path d="' + dEstrela(0, 0, 9) + '" fill="url(#gEstMar)" ' + ct(1.2) + '/>' +
        '<circle cx="-1.6" cy="-1.2" r=".8" fill="#fff" opacity=".8"/><circle cx="2" cy="1.6" r=".6" fill="#fff" opacity=".6"/></g>';
      return '<g class="cauda-' + tipo + '">' + d + '</g>';
    };
    // conchas: vieira rosa, caracol, coral balançando e a estrela dourada
    const vieira = (x, y, s, giro) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') rotate(' + (giro || 0) + ') scale(' + f(s) + ')">' +
        '<path d="M-9.4 1.8C-9.4 -3.2 -5.2 -6.6 0 -6.6C5.2 -6.6 9.4 -3.2 9.4 1.8C6.2 4.6 -6.2 4.6 -9.4 1.8Z" fill="url(#gConcha)" ' + ct(1.1) + '/>' +
        '<path d="M-7.2 -3.6L-4.8 2.4M-3.6 -5.4L-2.4 3.2M0 -6L0 3.4M3.6 -5.4L2.4 3.2M7.2 -3.6L4.8 2.4" fill="none" stroke="#d87d98" stroke-width=".8" stroke-linecap="round"/>' +
        '<path d="M-2.8 2.2Q0 3.8 2.8 2.2L1.8 5.2Q0 6.2 -1.8 5.2Z" fill="url(#gConcha)" ' + ct(.8) + '/>' +
      '</g>';
    const caracol = (x, y, s) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')">' +
        '<path d="M-6.4 0C-6.8 -1.8 -5.8 -3.4 -3.8 -3.8L4.6 -4.6C6.4 -4.6 7.4 -3.2 7.2 -1.4L6.8 0Z" fill="#e8c9a8" ' + ct(1) + '/>' +
        '<circle cx="1" cy="-7.4" r="5.6" fill="url(#gCaracol)" ' + ct(1.1) + '/>' +
        '<path d="M5.4 -8.6A4.4 4.4 0 1 0 2.6 -3.6A3 3 0 1 0 3.2 -8.4A1.6 1.6 0 1 0 2 -6.2" fill="none" stroke="#9c6b4a" stroke-width="1" stroke-linecap="round"/>' +
        '<path d="M-5.6 -3.6Q-7.4 -7.4 -6 -9.8M-4.2 -4Q-4.6 -7.2 -3 -9" fill="none" stroke="' + CONT + '" stroke-width="1" stroke-linecap="round"/>' +
        '<circle cx="-6.2" cy="-10.2" r=".9" fill="' + CONT + '"/><circle cx="-2.8" cy="-9.6" r=".9" fill="' + CONT + '"/>' +
      '</g>';
    const coral = (x, y, s, esp) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(esp ? -s : s) + ' ' + f(s) + ')"><g class="balanco" ' + anima(3.6, 5.6, 3) + '>' +
        '<path d="M-1.4 0C-2.4 -4.4 -1.6 -8 -3.6 -11.4C-5 -13.8 -5.2 -16.4 -4 -18.6C-2.6 -16.8 -2.2 -14.6 -2.8 -12.6C-1 -9.8 -.2 -6 .2 -2.4Z" fill="url(#gCoral)" ' + ct(1) + '/>' +
        '<path d="M.4 -6.6C1.6 -9.4 1.2 -12 3 -14.2C4.2 -15.8 4.4 -17.8 3.6 -19.6C5.6 -18.4 6.4 -15.8 5.4 -13.6C4.6 -10.8 3.2 -7.6 1.6 -4.6Z" fill="url(#gCoral)" ' + ct(1) + '/>' +
        '<path d="M-3.4 -8.2C-5.4 -9 -6.6 -10.8 -6.4 -12.8C-5 -12.2 -4 -10.8 -3.8 -9.4Z" fill="url(#gCoral)" ' + ct(.8) + '/>' +
        '<circle cx="-4.2" cy="-17.6" r=".8" fill="#ffc4a8"/><circle cx="4.4" cy="-18.4" r=".8" fill="#ffc4a8"/><circle cx="-6" cy="-12.4" r=".7" fill="#ffc4a8"/>' +
      '</g></g>';
    const conchasSVG = (x, y, s, espelho) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(espelho ? -s : s) + ' ' + f(s) + ')"><g class="pop" data-x="' + f(x) + '">' +
        coral(-12, 1, 1.1, false) + coral(14, 1, .85, true) +
        vieira(-7, 0, 1, -8) + caracol(8, .5, .8) +
        '<g transform="translate(17 -1.6) rotate(22)"><path d="' + dEstrela(0, 0, 7.4) + '" fill="url(#gEstMar)" ' + ct(1.1) + '/></g>' +
      '</g></g>';
    // adesivos do modelo solto
    const adesivo = (tipo, x, y, giro, s) => {
      const d = tipo === 'estrela' ? dEstrela(0, 0, 13) : dGota(0, 1.6, 8.4);
      return '<g transform="translate(' + f(x) + ' ' + f(y) + ') rotate(' + giro + ') scale(' + f(s) + ')"><g class="pop" data-x="' + f(x) + '">' +
        '<path d="' + d + '" transform="translate(1.4 2.2)" fill="#000" opacity=".3" stroke="#000" stroke-width="6" stroke-linejoin="round"/>' +
        '<path d="' + d + '" fill="#fff" stroke="' + CONT + '" stroke-width="7.6" stroke-linejoin="round"/>' +
        '<path d="' + d + '" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>' +
        '<path d="' + d + '" fill="url(#' + (tipo === 'estrela' ? 'gEstMar' : 'gGota') + ')" stroke="' + CONT + '" stroke-width="1.1" stroke-linejoin="round"/>' +
        '<path d="M-6.5 -6Q-8.4 -3.6 -7.4 -1.2" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round"/>' +
      '</g></g>';
    };
    // o koizinho mascote: nada parado, abana o rabo e solta bolhas; base em (x, y)
    const mascoteSVG = (x, y, s, espelho) => {
      masc = { x, y, s, espelho, topo: y - 34 * s };
      return '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(espelho ? -s : s) + ' ' + f(s) + ')"><g class="mascote"><g class="pop" data-x="' + f(x) + '"><g class="ms-nada">' +
        '<g transform="translate(0 -16)">' +
          // o rabão esvoaçante
          '<g class="ms-cauda"><path d="M13 0C18.6 -6.4 24.4 -8.6 28.6 -7.4C26.2 -4.6 24.8 -2.2 24.4 0C24.8 2.2 26.2 4.6 28.6 7.4C24.4 8.6 18.6 6.4 13 0Z" fill="url(#gKoiFin)" stroke="' + CONT + '" stroke-width="1.2" stroke-linejoin="round"/>' +
          '<path d="M16.6 -2.6Q20.4 -3.8 23.4 -2.8M16.6 2.6Q20.4 3.8 23.4 2.8" fill="none" stroke="#ff9a62" stroke-opacity=".7" stroke-width=".9" stroke-linecap="round"/></g>' +
          // o corpo branco com as manchas laranja
          '<path d="M-16 0C-11.4 -6.8 -4.6 -9.6 1.6 -8.8C7.6 -8 11.6 -4.6 12.6 0C11.6 4.6 7.6 8 1.6 8.8C-4.6 9.6 -11.4 6.8 -16 0Z" fill="url(#gKoi)" ' + ct(1.3) + '/>' +
          '<path d="M-3 -8.9C.4 -9.4 3.6 -8.8 6.2 -7.2C7 -4.6 7 -1.8 6.2 .8C3 1.6 -.6 1 -3.2 -.8C-4 -3.6 -3.8 -6.4 -3 -8.9Z" fill="' + COR.koi + '" opacity=".9"/>' +
          '<path d="M-13.6 2.6C-11.6 1 -9.2 .4 -7 1C-6.4 3 -6.8 5.2 -8.2 6.8C-10.4 6.4 -12.4 4.8 -13.6 2.6Z" fill="' + COR.koi + '" opacity=".8"/>' +
          '<path d="M9.4 -4.6C10.8 -3.6 11.8 -2 12.2 -.4" fill="none" stroke="#ffd9bd" stroke-width="1" stroke-linecap="round"/>' +
          // a nadadeira de cima e a peitoral
          '<path d="M-2 -8.6C-.6 -12.6 2 -15 5.2 -15.6C4.6 -12.4 4.8 -10 5.8 -7.6Z" fill="url(#gKoiFin)" stroke="' + CONT + '" stroke-width="1.1" stroke-linejoin="round"/>' +
          '<g class="ms-barb"><path d="M-4.6 3.4C-2.8 5.8 -2.6 8.6 -4 11.2C-6.6 9.8 -8 7.4 -7.8 4.6Z" fill="url(#gKoiFin)" stroke="' + CONT + '" stroke-width="1.1" stroke-linejoin="round"/></g>' +
          // olho, bigodinhos e a boquinha
          '<g class="ms-olhos"><circle cx="-10.2" cy="-2.6" r="2.6" fill="#fff" ' + ct(.9) + '/>' +
          '<circle cx="-10.8" cy="-2.4" r="1.4" fill="' + CONT + '"/><circle cx="-11.2" cy="-3" r=".55" fill="#fff"/></g>' +
          '<path d="M-15.4 1.6Q-16.8 2.6 -16.6 4.2M-14 2.8Q-14.6 4 -14 5.4" fill="none" stroke="' + CONT + '" stroke-width=".9" stroke-linecap="round"/>' +
          '<path d="M-15.8 -.4Q-14.8 .4 -13.8 -.2" fill="none" stroke="' + CONT + '" stroke-width="1" stroke-linecap="round"/>' +
        '</g>' +
      '</g></g></g></g>';
    };
    // peroletas nos quatro cantos do estandarte do nome
    const placaExtra = p => {
      const per = (x, y) => '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(1.6 * k) + '" fill="url(#gPer)" stroke="' + CONT + '" stroke-width="' + f(.7 * k) + '"/>' +
        '<circle cx="' + f(x - .5 * k) + '" cy="' + f(y - .55 * k) + '" r="' + f(.5 * k) + '" fill="#fff" opacity=".9"/>';
      return per(p.x0 + 3.4 * k, p.y0 + 3.4 * k) + per(p.x1 - 3.4 * k, p.y0 + 3.4 * k) +
             per(p.x0 + 3.4 * k, p.y1 - 3.4 * k) + per(p.x1 - 3.4 * k, p.y1 - 3.4 * k);
    };
    // a presilha de concha com pérola e argolinha dourada, perto do canto direito (é nela que a âncora engataria)
    const argolaSVG = (x, y, s) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')"><g class="pop" data-x="' + f(x) + '">' +
        '<circle cy="-7" r="4.6" fill="none" stroke="' + CONT + '" stroke-width="4.2"/>' +
        '<circle cy="-7" r="4.6" fill="none" stroke="url(#gOuro)" stroke-width="2.4"/>' +
        '<path d="M-3.6 -9A4.2 4.2 0 0 1 -.6 -11.2" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".9" stroke-linecap="round"/>' +
        '<g transform="translate(0 2.4)">' +
          '<path d="M-8.4 1.8C-8.4 -2.8 -4.6 -6 0 -6C4.6 -6 8.4 -2.8 8.4 1.8C5.6 4.2 -5.6 4.2 -8.4 1.8Z" fill="url(#gOuro)" ' + ct(1.2) + '/>' +
          '<path d="M-6.2 -3.6L-4.2 2.6M-3.2 -5L-2 3.2M0 -5.4L0 3.4M3.2 -5L2 3.2M6.2 -3.6L4.2 2.6" fill="none" stroke="' + COR.douradoEscuro + '" stroke-width=".8" stroke-linecap="round"/>' +
          '<circle cy="-1" r="2.6" fill="url(#gPer)" ' + ct(.9) + '/><circle cx="-.8" cy="-1.8" r=".8" fill="#fff"/>' +
        '</g>' +
      '</g></g>';
    // leque de vieira abraçando o canto da borda, abrindo pra dentro (rot: 0 cima-esq, 90 cima-dir, 180 baixo-dir, 270 baixo-esq)
    const cantoneiraSVG = (x, y, s, rot) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') rotate(' + rot + ') scale(' + f(s) + ')"><g transform="translate(4.6 4.6) rotate(135)">' +
        vieira(0, 2.4, 1.35, 0) +
      '</g></g>';
    // a NAMI do evento: a sereia com o cetro erguido (a luz da pérola e a bolha são pintadas no canvas)
    const bonecoSVG = () => {
      const pele = '#f2b899', peleSombra = '#d99270';
      return '<defs>' +                                 // o carimbo vira um SVG avulso: leva os gradientes junto

        '<linearGradient id="gOuro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + COR.douradoClaro + '"/><stop offset=".45" stop-color="' + COR.dourado + '"/><stop offset="1" stop-color="' + COR.douradoEscuro + '"/></linearGradient>' +

        '<radialGradient id="gPer" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="' + COR.perola + '"/><stop offset="1" stop-color="#c0cfe4"/></radialGradient>' +
        '<linearGradient id="gCabelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a8cc0"/><stop offset=".5" stop-color="#2f6494"/><stop offset="1" stop-color="#1d4468"/></linearGradient>' +
        '<linearGradient id="gOlho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3a10"/><stop offset=".45" stop-color="#c07828"/><stop offset=".85" stop-color="#f0b85c"/><stop offset="1" stop-color="#ffe4a8"/></linearGradient>' +

  //  tema LULU: roxo de fada, glitter, cogumelos e o resgate da Jinx

  function arteLulu() {
    // cogumelo encantado de bolinhas; tronquinho apoiado em (x, y+10*s)
    const cogumelo = (x, y, s, giro) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') rotate(' + (giro || 0) + ') scale(' + f(s) + ')">' +
        '<path d="M-4.6 2L-3.6 10Q0 11.6 3.6 10L4.6 2Z" fill="#f0e2c8" ' + ct(1.1) + '/>' +
        '<path d="M-4.4 5.4Q0 6.6 4.4 5.4" fill="none" stroke="#c9b68e" stroke-width=".9" stroke-linecap="round"/>' +
        '<path d="M-11.8 2.6C-12.6 -5 -6.8 -10.6 0 -10.6C6.8 -10.6 12.6 -5 11.8 2.6C7.4 4.8 -7.4 4.8 -11.8 2.6Z" fill="url(#gCog)" ' + ct(1.3) + '/>' +
        '<circle cx="-5.4" cy="-3.6" r="2.2" fill="#fff" opacity=".92"/><circle cx="3" cy="-6" r="1.6" fill="#fff" opacity=".92"/>' +
        '<circle cx="6.6" cy="-1.4" r="1.9" fill="#fff" opacity=".92"/><circle cx="-1" cy="-.6" r="1.2" fill="#fff" opacity=".85"/>' +
        '<path d="M-8.8 -5.8Q-4 -9.8 1.6 -9.4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>' +
      '</g>';
    const emblemaSVG = (x, y, s) =>
      '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')"><g class="pop" data-x="' + f(x) + '">' +
        '<circle class="aura" r="25" fill="url(#gAura)"/>' +
        cogumelo(0, 2, 1.7, 0) +
        '<path class="cintila" ' + anima(2, 3.2, 0) + ' d="' + dEstrela(14, -14, 4) + '" fill="' + COR.verdeClaro + '"/>' +
        '<path class="cintila" ' + anima(2.4, 3.6, 0) + ' d="' + dBrilho(-15, -11, 3.4) + '" fill="#fff"/>' +
      '</g></g>';
    // o círculo de fada atrás do cogumelo: estrelinhas e cogumelinhos girando, pó dourado ao contrário
    const aroSVG = (x, y, s) => {
      let estrelas = '', cogus = '', tracos = '';
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5, cx2 = Math.cos(a) * 45.6, cy2 = Math.sin(a) * 45.6;
        if (i % 2) estrelas += '<path d="' + dEstrela(cx2, cy2, 3.4) + '" fill="' + COR.verdeClaro + '" stroke="' + CONT + '" stroke-width=".7"/>';
        else cogus += '<g transform="translate(' + f(cx2) + ' ' + f(cy2) + ') rotate(' + f(a * 180 / Math.PI + 90) + ')">' + cogumelo(0, -2, .4, 0) + '</g>';
      }
      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 + .2, c = Math.cos(a), sn = Math.sin(a); tracos += 'M' + f(c * 34.6) + ' ' + f(sn * 34.6) + 'L' + f(c * 37.8) + ' ' + f(sn * 37.8); }
      return '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')"><g class="aro">' +
        '<circle r="56" fill="url(#gHalo)"/>' +
        '<g class="gira">' +
          '<circle r="49.4" fill="none" stroke="' + COR.roxoClaro + '" stroke-width="1.6"/>' +
          '<circle r="41.6" fill="none" stroke="' + COR.verde + '" stroke-opacity=".7" stroke-width="1"/>' +
          estrelas + cogus +
        '</g>' +
        '<g class="gira-contra">' +
          '<path d="' + tracos + '" stroke="' + COR.douradoClaro + '" stroke-opacity=".8" stroke-width="1.1" stroke-linecap="round"/>' +
          '<circle r="26" fill="none" stroke="#fff" stroke-width=".9" stroke-dasharray="4.4 2.6"/>' +
          '<circle r="19.5" fill="none" stroke="' + COR.roxo + '" stroke-width=".8"/>' +
        '</g>' +
      '</g></g>';
    };
    // florzinha de cinco pétalas
    const flor = (x, y, s, cor) => {
      let p = '';
      for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 - Math.PI / 2; p += '<circle cx="' + f(Math.cos(a) * 3.1) + '" cy="' + f(Math.sin(a) * 3.1) + '" r="2.5" fill="' + cor + '" stroke="' + CONT + '" stroke-width=".7"/>'; }
      return '<g transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(s) + ')">' + p + '<circle r="1.9" fill="url(#gOuro)" stroke="' + CONT + '" stroke-width=".7"/></g>';
    };

    const mascP = !MASCOTE ? null
      : { x: X + 36 * k, y: NAUT ? Y + 1.4 * k : Y - 8 * k };        // em cima da borda da câmera, na pontinha esquerda
    bonP = SOLTA ? { x: X + W * .4, y: Y + 1.2 * k, plat: true } : { x: Math.max(RX + 70 * k, X - 96 * k), y: Y - 2 * k, plat: true };

    // ---- defs ----
    const hs = 14 * k;
    partes.push('<defs>' + ARTE.defs(hs) +
      (placa ? '<clipPath id="clipPlaca"><path d="' + formaPlaca(0) + '"/></clipPath>' : '') +
    '</defs>');

    // ---- a borda: o corpo do tema, o filete, o miolo com o padrãozinho e o cordão tracejado por dentro ----
    const dB = caminhoBorda(xl, yt, xr, yb, r, 40 * k), bm = B * .5;
    const dR = caminhoBorda(X + 2 * ins, Y + 2 * ins, X + W - 2 * ins, Y + H - 2 * ins, Math.max(1, r - ins), 40 * k);   // a beirada de dentro
    const linha = (stroke, w, extra) => '<path d="' + dB + '" fill="none" stroke="' + stroke + '" stroke-width="' + f(w) + '" stroke-linejoin="round" ' + (extra || '') + '/>';
    const rl = 2.5 * k, passo = 2 * rl + 1.1 * k, rc = ARTE.renda.cores;
    const renda = (stroke, w) => '<path d="' + dR + '" fill="none" stroke="' + stroke + '" stroke-width="' + f(w) + '" stroke-linecap="round" stroke-dasharray="0 ' + f(passo) + '"/>';
    partes.push(
      renda(rc[0], 2 * rl + 1.6 * k), renda(rc[1], 2 * rl), renda(rc[2], rl * .7),
      linha(ARTE.halo[0], B + CW + 14 * k, 'stroke-opacity=".12"'), linha(ARTE.halo[1], B + CW + 7 * k, 'stroke-opacity=".16"'),
      linha(CONT, B + CW), linha('url(#gBorda)', B),
      linha(ARTE.filete, bm + 2.6 * k), linha('url(#gMiolo)', bm), linha('url(#pMiolo)', bm),
      '<path d="' + dB + '" transform="translate(' + f(-B * .16) + ' ' + f(-B * .34) + ')" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="' + f(B * .1) + '" stroke-linecap="round"/>',
      '<path class="brilho-borda" d="' + dB + '" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="' + f(B * .42) + '" stroke-linecap="round"/>');

    // ---- brilhinhos piscando em volta (atrás da placa) ----
    const zb = SOLTA ? [X - 40 * k, X + W + 40 * k, 14 * k, Y - 80 * k] : [RX + 40 * k, X - 40 * k, RY + 20 * k, Y - 70 * k];
    for (let i = 0; i < 6; i++) partes.push(pisca(rnd(zb[0], zb[1]), rnd(zb[2], zb[3]), rnd(4, 7) * k));

    // ---- adesivos na borda e as conchas / cracas nos cantos ----
    if (CONCHAS) {
      const tp = ARTE.adesivoTipos;
      const ads = SOLTA ? [[tp[0], X + W * .5, yb, -8], [tp[1], xr, Y + H * .5, 10]] : [];
      const cantos = SOLTA ? [[xl + o, yb - o, false], [xr - o, yt + o, true]] : [[xl, Math.min(yb, SH) - 20 * k, false]];
      for (const [tipo, x, y, g] of ads) partes.push(ARTE.adesivo(tipo, x, y, g, .8 * k));
      for (const [x, y, esp] of cantos) { partes.push(ARTE.conchasSVG(x, y, sC, esp)); flores.push({ x, y, r: 14 * k }); }
    }

    // ---- a lateral e os cantos: o aro girando com o emblema por fora, a corrente / cordão descendo
    //      pela borda da esquerda, as cantoneiras e a argola de amarração (é nela que a âncora engata) ----
    const cx0 = embP ? embP.x : X - 20 * k, cy0 = embP ? embP.y : Y + Math.min(H * .42, 150 * k);
    if (embP) partes.push(ARTE.aroSVG(cx0, cy0, sAro));
    if (CORRENTE && !abre.esq) partes.push(ARTE.caudaSVG('b', xl, yt + 10 * k, Math.min(84 * k, H * .48), B * .78));
    if (!abre.cima && !abre.esq) partes.push(ARTE.cantoneiraSVG(xl, yt, 1.1 * k, 0));
    if (!abre.cima && !abre.dir) partes.push(ARTE.cantoneiraSVG(xr, yt, 1.1 * k, 90));
    if (!abre.baixo && !abre.dir) partes.push(ARTE.cantoneiraSVG(xr, yb, 1.1 * k, 180));
    if (!abre.baixo && !abre.esq) partes.push(ARTE.cantoneiraSVG(xl, yb, 1.1 * k, 270));
    gancho = { x: xr - 18 * k, y: yt - 2 * k };
    frente.push(ARTE.argolaSVG(gancho.x, gancho.y + 4 * k, k));
    flores.push({ x: gancho.x, y: gancho.y, r: 8 * k });

    // ---- a placa do nome ----
    if (placa) {
      const p = placa, fam = FAMILIA.replace(/"/g, ''), esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const base = p.cy + (p.asc - p.desc) / 2, NM = esc(NOME.toUpperCase());
      const txt = (dx, dy, extra) => '<text x="' + f(p.cx + dx) + '" y="' + f(base + dy) + '" text-anchor="middle" font-family=\'' + fam + '\' font-size="' + f(p.fs) + '" ' + extra + '>' + NM + '</text>';
      frente.push('<g class="placa">' +
        '<path d="' + formaPlaca(0) + '" transform="translate(' + f(2.2 * k) + ' ' + f(2.6 * k) + ')" fill="rgba(0,0,0,.3)"/>' +
        '<path d="' + formaPlaca(0) + '" fill="url(#gPlaca)" stroke="' + CONT + '" stroke-width="' + f(2.8 * k) + '" stroke-linejoin="round"/>' +
        '<path d="' + formaPlaca(3.2 * k) + '" fill="none" stroke="' + ARTE.filete + '" stroke-width="' + f(1.2 * k) + '" stroke-linejoin="round"/>' +
        '<g clip-path="url(#clipPlaca)"><rect class="reflexo-h" style="--dist:' + f(p.PW + 70 * k) + 'px" x="' + f(p.x0 - 46 * k) + '" y="' + f(p.y0 - 4 * k) + '" width="' + f(26 * k) + '" height="' + f(p.TH + 8 * k) + '" fill="url(#gReflexo)"/></g>' +
        txt(1.4 * k, 1.8 * k, 'fill="' + ARTE.sombraPlaca + '" stroke="' + ARTE.sombraPlaca + '" stroke-width="' + f(4.2 * k) + '" stroke-linejoin="round"') +
        txt(0, 0, 'fill="url(#gTexto)" stroke="' + CONT + '" stroke-width="' + f(3.6 * k) + '" stroke-linejoin="round" paint-order="stroke"') +
        ARTE.placaExtra(p) +
        '<g class="cintila" ' + anima(2.4, 3.4, 0) + '>' + brilho(p.x1 - 1 * k, p.y0 + 1 * k, 6 * k, '#fff') + '</g>' +
      '</g>');
      for (const u of [.25, .5, .75]) flores.push({ x: p.x0 + (p.x1 - p.x0) * u, y: p.cy, r: p.TH / 2 });
    }

    // ---- o emblema por cima da ponta da placa; o mascote por último ----
    if (embP) { frente.push(ARTE.emblemaSVG(cx0, cy0, sE)); flores.push({ x: cx0, y: cy0, r: 14 * k }); }
    if (mascP) frente.push(ARTE.mascoteSVG(mascP.x, mascP.y, sM, mascP.espelho));

    cena.innerHTML = partes.join('') + frente.join('');
    placaEl = cena.querySelector('.placa');
    mascEl = cena.querySelector('.mascote');
    aroEl = cena.querySelector('.aro');
    if (masc) flores.push({ x: masc.x, y: masc.y - 24 * masc.s, r: 16 * masc.s });

    // o brilho da borda: um traço que corre a borda toda e some por um tempo
    const bb = cena.querySelector('.brilho-borda'), L = bb.getTotalLength(), Dd = 44 * k;
    bb.style.strokeDasharray = f(Dd) + ' ' + f(2 * L);
    bb.style.setProperty('--de', f(Dd) + 'px'); bb.style.setProperty('--ate', f(-2 * L) + 'px');
    bb.style.setProperty('--t', f((Dd + 2 * L) / (240 * k)) + 's');

    // ---- onde as bolhas sobem: do lado de fora da câmera, nunca na frente dela ----
    if (SOLTA) zonasB = [{ x0: 26 * k, x1: X - 22 * k, y0: 30 * k, y1: SH - 12 * k }, { x0: X + W + 22 * k, x1: SW - 26 * k, y0: 30 * k, y1: SH - 12 * k },
                         { x0: X - 4 * k, x1: X + W + 4 * k, y0: 30 * k, y1: Y - 22 * k }];
    else zonasB = [{ x0: Math.max(RX + 36 * k, X - 340 * k), x1: X - 24 * k, y0: RY + 34 * k, y1: Math.min(RB - 8 * k, SH * .885) }];   // à esquerda da câmera, parando antes do painel de itens do LoL
    for (const z of zonasB) z.x1 = Math.max(z.x1, z.x0 + 10 * k);
    for (let i = 0; i < NB; i++) bolhas.push(novaBolha(i, true));
  }

  // ================================================================
  //  carimbos (desenhos prontos, pintados no canvas): os peixinhos e o campeão
  // ================================================================
  let carimbosPeixe = [], carimboBon = null, carimbosExtras = {};

  function svgPronto(vb, w, h, miolo) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="' + vb.join(' ') + '">' + miolo + '</svg>';
  }
  function carimbo(vb, miolo, escala) {
    const w = Math.max(1, Math.ceil(vb[2] * escala)), h = Math.max(1, Math.ceil(vb[3] * escala));
    return new Promise(res => {
      const img = new Image();
      img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); res(c); };
      img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgPronto(vb, w, h, miolo));
    });
  }
  async function prepararCarimbos() {
    const eP = TAM_PEIXE * 1.3 * k * K, eB = TAM_BON * 1.15 * k * K, ex = BONECO ? ARTE.extras || [] : [];
    const [ps, b, ...exs] = await Promise.all([
      Promise.all(CORES_PEIXE.map(c => carimbo(PEIXE_VB, ARTE.peixeSVG(c), eP))),
      BONECO ? carimbo(BON_VB, ARTE.bonecoSVG(), eB) : null,
      ...ex.map(e => carimbo(e.vb, e.svg(), e.tam * 1.15 * k * K)),
    ]);
    if (ps.every(Boolean)) carimbosPeixe = ps;
    if (b) carimboBon = b;
    ex.forEach((e, i) => { if (exs[i]) carimbosExtras[e.id] = { c: exs[i], vb: e.vb, tam: e.tam }; });
  }

  // ================================================================
  //  bolhas subindo devagar, balançando de um lado pro outro
  // ================================================================
  const pertoCam = (x, y, m) => {                       // 0 em cima da câmera, 1 a partir de m px dela
    const dx = Math.max(X - x, 0, x - X - W), dy = Math.max(Y - y, 0, y - Y - H);
    return Math.min(1, Math.hypot(dx, dy) / m);
  };
  const naFonte = (x, y, m) => Math.max(0, Math.min(1, Math.min(x - RX, RR - x, y - RY, RB - y) / ((m || 16) * k)));   // some antes da borda da área desenhada
  function zonaAleatoria() {                            // escolhe uma zona pelo tamanho dela
    const areas = zonasB.map(z => (z.x1 - z.x0) * (z.y1 - z.y0)), tot = areas.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot;
    for (let i = 0; i < zonasB.length; i++) { r -= areas[i]; if (r <= 0) return zonasB[i]; }
    return zonasB[0];
  }
  function novaBolha(i, espalha) {                      // a bolha nasce já dentro do espaço (nunca entra pela beirada, onde ficaria cortada)
    const z = zonaAleatoria(), amp = Math.min(rnd(6, 14) * k, (z.x1 - z.x0) * .3), x0 = rnd(z.x0 + amp, Math.max(z.x0 + amp, z.x1 - amp));
    const y = espalha ? rnd(Math.min(z.y1, z.y0 + 60 * k), z.y1) : rnd(z.y1 - (z.y1 - z.y0) * .35, z.y1 - 4 * k);
    return { i, z, x0, x: x0, y, fase: rnd(0, 7), freq: rnd(.9, 1.6), amp, vy: rnd(16, 28) * k,
             deriva: rnd(-3, 3) * k, r: rnd(2.2, 5.4) * k, ix: 0, iy: 0,
             idade: espalha ? rnd(0, 2) : 0 };
  }
  // as bolhas vivem num relógio próprio (tb), que anda VEL vezes o normal
  let tb = 0;
  function moverBolha(p, dt) {
    const dv = dt * VEL, s = Math.sin(tb * p.freq + p.fase), z = p.z;
    p.idade += dt;
    p.y -= p.vy * dv;                                   // sobe num ritmo constante, balançando
    p.x0 += p.deriva * dv + p.ix * dt;
    p.y += p.iy * dt;
    const dec = Math.exp(-1.8 * dt); p.ix *= dec; p.iy *= dec;
    p.x = p.x0 + s * p.amp;
    if (p.x0 < z.x0 + p.amp) p.x0 += (z.x0 + p.amp - p.x0) * Math.min(1, dt * 2);
    if (p.x0 > z.x1 - p.amp) p.x0 -= (p.x0 - z.x1 + p.amp) * Math.min(1, dt * 2);
    if (p.y < z.y0 + 10 * k || naFonte(p.x, p.y, 34) <= 0 && p.idade > 1) {       // chegou no alto (ou o sopro jogou pra fora): estoura e nasce de novo
      faisca(p.x, p.y, rnd(3, 5) * k, rnd(.4, .6), escolhe(['#fff', brilhos[1]]));
      Object.assign(p, novaBolha(p.i, false));
    }
  }
  function desenhaBolhas(t) {
    for (const p of bolhas) {
      const nasce = Math.min(1, p.idade / .9);
      const a = nasce * Math.max(0, Math.min(1, (p.y - p.z.y0) / (40 * k))) * pertoCam(p.x, p.y, 16 * k) * naFonte(p.x, p.y, 34);
      if (a <= .01) continue;
      const r = p.r * (.8 + .2 * nasce) * (1 + .06 * Math.sin(t * 3 + p.fase));
      if (LULU) {                                       // no tema da Lulu sobe GLITTER em vez de bolha
        ctx.globalAlpha = a * (.65 + .35 * Math.sin(t * 4 + p.fase));
        ctx.fillStyle = ['#fff', brilhos[1], brilhos[2]][p.i % 3];
        desenhaBrilho(p.x, p.y, r * 1.5, t * .7 + p.fase);
        continue;
      }
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(p.x - r * .3, p.y - r * .35, r * .1, p.x, p.y, r);
      if (NAUT) { g.addColorStop(0, 'rgba(230,255,250,.5)'); g.addColorStop(.75, 'rgba(120,230,210,.1)'); g.addColorStop(1, 'rgba(90,210,190,.3)'); }
      else { g.addColorStop(0, 'rgba(240,255,252,.55)'); g.addColorStop(.75, 'rgba(160,244,233,.12)'); g.addColorStop(1, 'rgba(120,230,215,.32)'); }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(.7, r * .16);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x - r * .32, p.y - r * .32, r * .42, Math.PI * .95, Math.PI * 1.55); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(p.x + r * .3, p.y + r * .25, Math.max(.5, r * .12), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ================================================================
  //  o evento: o campeão surge num redemoinho e lança a âncora / a bolha d'água
  // ================================================================
  // NAUTILUS: gira a âncora, ARREMESSA na argola do canto direito e se arrasta até lá, igual ao Q
  // NAMI: ergue o cetro e uma ONDA varre e inunda a câmera com água translúcida, até escoar
  const EV = { surge: .3, carga: 1, solta: 1.15, arrasta: 1.6, chega: 2.1, some: NAUT ? 3.2 : 4.4 };   // tempos (s) desde o começo
  const CONGELA = num('pausa', 0, 0, 10);               // só pra conferir o desenho: para o campeão nesse instante
  const SBON = TAM_BON * k;
  let evT0 = -99, evAte = -99, bon = null, bonOx = 0, ancora = null, ondaAgua = null, resgate = null, tiraEv = 0;
  const suave = u => u * u * (3 - 2 * u);
  const volta = u => 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2);   // passa um pouquinho e volta
  const doBon = (lx, ly) => [bonP.x + bonOx + lx * SBON, bonP.y + ly * SBON];   // ponto do campeão (unidades do desenho) na tela
  const tempoBon = t => CONGELA ? Math.min(t - bon.t0, CONGELA) : t - bon.t0;
  const gotaCores = NAUT ? ['#b8fff0', '#7fe3d2', '#52e8cc', '#fff'] : LULU ? ['#c8ffa8', '#c9a2f0', '#8ce85a', '#fff'] : ['#a4f4e9', '#6fe3d4', '#3fd4c5', '#fff'];

  function evento(t) {
    if (BONECO && (!carimboBon || (LULU && !(carimbosExtras.jinx && carimbosExtras.ashe)))) return false;   // as bonecas ainda estão carregando: tenta já já
    evT0 = t; evAte = t + (NAUT ? 4 : LULU ? 6.3 : 5);
    cena.classList.add('evento');
    clearTimeout(tiraEv);
    tiraEv = setTimeout(() => cena.classList.remove('evento'), NAUT ? 4000 : LULU ? 6300 : 5000);
    if (aroEl && aroEl.animate) aroEl.animate([{ transform: 'rotate(0deg) scale(1)' }, { transform: 'rotate(220deg) scale(1.25)', offset: .4 }, { transform: 'rotate(360deg) scale(1)' }],
      { duration: 1800, easing: 'cubic-bezier(.2,.7,.3,1)' });
    if (embP) for (let i = 0; i < 8; i++) faisca(embP.x + rnd(-14, 14) * k, embP.y + rnd(-16, 12) * k, rnd(4, 7) * k, rnd(.5, .9), escolhe(brilhos));
    if (LULU) {                                         // o RESGATE precisa das três bonecas prontas
      if (BONECO && carimboBon && carimbosExtras.jinx && carimbosExtras.ashe) resgate = { t0: t, flechas: [], hp: .3 };
      else {                                            // sem as bonecas: só uma chuva de glitter
        if (embP) for (let i = 0; i < 14; i++) faisca(embP.x + rnd(-30, 30) * k, embP.y + rnd(-40, 20) * k, rnd(4, 8) * k, rnd(.5, 1), escolhe(brilhos));
        brilhoPlaca(); onda();
      }
    } else if (BONECO && carimboBon) {
      bon = { t0: t, soltou: false, sumiu: false, bateu: false };
      bonOx = 0;
      puf(bonP.x - 4 * k, bonP.y - 40 * SBON, .55);
    } else if (NAUT) lancarAncora(t, embP ? embP.x + 16 * k : X + 10 * k, embP ? embP.y - 12 * k : Y + 10 * k, true);
    else ondaAgua = { t0: t + .2, kois: [], spray: [] };
    return true;
  }
  function lancarAncora(t, x, y, sozinha) {             // a âncora sai voando da mão (ou da escotilha) até a argola
    ancora = { x0: x, y0: y, x, y, t0: t, fase: 'voa', sozinha, dur: Math.max(.24, Math.hypot(gancho.x - x, gancho.y - y) / (860 * k)) };
  }
  function atualizaBoneco(t) {
    const tl = tempoBon(t);
    if (!bon.soltou && tl >= EV.solta) {
      bon.soltou = true;
      if (NAUT) { const [x, y] = doBon(G[0], G[1]); lancarAncora(t, x, y, false); }
      else ondaAgua = { t0: t, kois: [], spray: [] };
    }
    if (tl > EV.surge && tl < EV.solta && Math.random() < .45) {       // brilhinho juntando na mão / na pérola do cetro
      const [x, y] = doBon(G[0], G[1]);
      faisca(x + rnd(-9, 9) * k, y + rnd(-9, 9) * k, rnd(2.5, 4.5) * k, rnd(.3, .5), escolhe(['#fff', brilhos[1]]));
    }
    if (NAUT && bon.soltou) {                           // a corrente puxa: ele desliza pela borda até a argola
      const fim = gancho.x - 30 * k - bonP.x;
      if (tl >= EV.arrasta && tl < EV.chega) {
        bonOx = suave((tl - EV.arrasta) / (EV.chega - EV.arrasta)) * fim;
        if (Math.random() < .6) bolhaSolta(bonP.x + bonOx - rnd(6, 20) * k, bonP.y - rnd(8, 70) * k);
      } else if (tl >= EV.chega) {
        bonOx = fim;
        if (!bon.bateu) { bon.bateu = true; impacto(gancho.x, gancho.y, t); }
      }
    }
    if (!bon.sumiu && tl >= EV.some) { bon.sumiu = true; puf(bonP.x + bonOx - 4 * k, bonP.y - 40 * SBON, .5); if (NAUT) ancora = null; }
    if (tl >= EV.some + .4) { bon = null; bonOx = 0; }
  }
  function impacto(x, y, t) {                           // a âncora engata e ele chega: faíscas, anéis de choque e peixes espantados
    parts.push({ tipo: 'estouro', x, y, tam: .72, rot: rnd(0, 1), idade: 0, vida: .7, grande: true });
    for (let i = 0; i < 12; i++) gota(x - 6 * k, y - 4 * k, .85, true);
    for (let i = 0; i < 7; i++) peixeSolto(x - 14 * k, y - 6 * k, .9);
    for (let i = 0; i < 8; i++) faisca(x + rnd(-26, 18) * k, y + rnd(-22, 10) * k, rnd(4, 7.5) * k, rnd(.5, .9), escolhe(brilhos));
    for (let i = 0; i < 8; i++) bolhaSolta(x + rnd(-24, 10) * k, y + rnd(-12, 10) * k);
    for (const p of bolhas) {                           // as bolhas que estavam subindo levam um empurrão
      const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < 240 * k) { const fz = (1 - d / (240 * k)) * 150 * k; p.ix += dx / d * fz; p.iy += dy / d * fz - 24 * k; }
    }
    brilhoPlaca();
    onda();
    if (masc && FALAS.length) falar(T.falaEvento, 2.4);
  }
  // a âncora, pintada no canvas: a argola em (x, y), a haste descendo; gira em volta da argola
